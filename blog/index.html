---
layout: blog
title: Blog
description: "Corey Bailey on building tools for trades companies, and on the thinking that makes the work clearer."
---
<section class="listing">
  <h1>Blog</h1>
  <p class="desc soft">{{ page.description }}</p>
  <ul class="posts">
{%- for post in site.posts %}
    <li><a href="{{ post.url }}">{{ post.title | escape }}</a><time class="soft" datetime="{{ post.date | date: '%Y-%m-%d' }}">{{ post.date | date: '%-d %B %Y' }}</time></li>
{%- endfor %}
  </ul>
</section>
